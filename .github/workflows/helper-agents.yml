# Starts a cloud helper agent when the lead hands it work on GitHub.
# How it works, setup and the kill switch: see AUTOMATION.md.
name: Helper agents

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  route:
    # Kill switch: repo variable AUTOMATION_ENABLED must be exactly "true".
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.route.outputs.run }}
      agent: ${{ steps.route.outputs.agent }}
      owner: ${{ steps.route.outputs.owner }}
      issue: ${{ steps.route.outputs.issue }}
      pr: ${{ steps.route.outputs.pr }}
      branch: ${{ steps.route.outputs.branch }}
      trigger: ${{ steps.route.outputs.trigger }}
    steps:
      - name: Decide which helper (if any) should run
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          # Humans allowed to trigger helpers. Bots (incl. the helpers themselves) are never listed.
          TEAM: muhammet842 Kosmint Cagan2112
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          EVENT_ASSIGNEE: ${{ github.event.assignee.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REVIEW_STATE: ${{ github.event.review.state }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          out()  { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          skip() { echo "No helper run: $1"; out run false; exit 0; }

          case " $TEAM " in *" $ACTOR "*) ;; *) skip "actor '$ACTOR' is not a team member";; esac
          if printf '%s\n%s\n' "$COMMENT_BODY" "$REVIEW_BODY" | grep -qi '#nobot'; then skip "comment contains #nobot"; fi

          NUM=""; PR=""; BRANCH=""; TRIGGER=""
          if [ "$EVENT" = "issues" ]; then
            NUM="$ISSUE_NUMBER"; TRIGGER="assigned"
          elif [ "$EVENT" = "issue_comment" ] && [ "$IS_PR_COMMENT" != "true" ]; then
            NUM="$ISSUE_NUMBER"; TRIGGER="issue-comment"
          else
            if [ "$EVENT" = "issue_comment" ]; then
              PR="$ISSUE_NUMBER"; TRIGGER="pr-comment"
              BRANCH=$(gh pr view "$PR" -R "$REPO" --json headRefName --jq .headRefName)
            else
              [ "$REVIEW_STATE" = "approved" ] && skip "approvals need no helper run"
              PR="$PR_NUMBER"; BRANCH="$PR_HEAD"; TRIGGER="pr-review-$REVIEW_STATE"
            fi
            PR_LABELS=$(gh pr view "$PR" -R "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
            case " $PR_LABELS " in *" otomasyon-durdur "*) skip "PR #$PR is paused";; esac
            NUM=$(printf '%s' "$BRANCH" | sed -nE 's#^(claude|gemini)/([0-9]+)-.*#\2#p')
            [ -n "$NUM" ] || skip "branch '$BRANCH' is not a helper branch"
          fi

          INFO=$(gh issue view "$NUM" -R "$REPO" --json state,labels,assignees)
          [ "$(jq -r .state <<<"$INFO")" = "OPEN" ] || skip "Issue #$NUM is not open"
          [ "$(jq '.assignees | length' <<<"$INFO")" = "1" ] || skip "Issue #$NUM needs exactly one assignee"
          OWNER=$(jq -r '.assignees[0].login' <<<"$INFO")
          if [ "$EVENT" = "issues" ] && [ "$EVENT_ASSIGNEE" != "$OWNER" ]; then skip "assignment event is not for the current owner"; fi
          LABELS=$(jq -r '[.labels[].name] | join(" ")' <<<"$INFO")
          has() { case " $LABELS " in *" $1 "*) return 0;; esac; return 1; }
          has studio && skip "studio Issues stay with the lead"
          has otomasyon-durdur && skip "Issue #$NUM is paused"
          if has agent:claude && ! has agent:gemini; then AGENT=claude
          elif has agent:gemini && ! has agent:claude; then AGENT=gemini
          else skip "Issue #$NUM needs exactly one agent label"; fi

          # Which cloud helpers exist. The lead's own Issues (muhammet842) run locally, never here.
          case "$AGENT/$OWNER" in
            claude/Kosmint|gemini/Kosmint|gemini/Cagan2112) ;;
            *) skip "no cloud helper for $AGENT/$OWNER";;
          esac

          # Issue events: continue on the existing PR branch if there is one.
          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh api "repos/${REPO}/git/matching-refs/heads/${AGENT}/${NUM}-" --jq '.[0].ref // empty' \
                     | sed 's#^refs/heads/##')
            if [ -n "$BRANCH" ]; then
              PR=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            fi
          fi

          echo "Run $AGENT helper for $OWNER on Issue #$NUM (trigger: $TRIGGER, PR: ${PR:-none}, branch: ${BRANCH:-new})"
          out run true; out agent "$AGENT"; out owner "$OWNER"; out issue "$NUM"
          out pr "$PR"; out branch "$BRANCH"; out trigger "$TRIGGER"

  claude:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.agent == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: helper-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.branch || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build prompt
        id: prompt
        env:
          AGENT: claude
          OWNER: ${{ needs.route.outputs.owner }}
          ISSUE: ${{ needs.route.outputs.issue }}
          PR: ${{ needs.route.outputs.pr }}
          BRANCH: ${{ needs.route.outputs.branch }}
          TRIGGER: ${{ needs.route.outputs.trigger }}
        run: |
          {
            echo 'text<<PROMPT_EOF'
            echo "## This run"
            echo "- Agent: $AGENT (cloud helper)"
            echo "- Working for: $OWNER"
            echo "- Issue: #$ISSUE"
            echo "- Pull request: ${PR:-none yet}"
            echo "- Branch: ${BRANCH:-none yet}"
            echo "- Trigger: $TRIGGER"
            echo
            # Always read the instructions from main, so a branch can't rewrite its own prompt.
            git show origin/main:.github/agents/helper.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.HELPER_CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns ${{ vars.HELPER_MAX_TURNS || '80' }}
            --allowedTools "Bash(git:*),Bash(gh:*),Edit,Write,Read,Glob,Grep"

      - name: Report failure on the Issue
        if: failure()
        env:
          ISSUE: ${{ needs.route.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "Cloud Claude helper run failed or ran out of time: $RUN_URL. The lead will look at it."

  gemini:
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.agent == 'gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: helper-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Headless Gemini CLI refuses to run in an untrusted folder (exits before calling the API).
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.branch || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build prompt
        id: prompt
        env:
          AGENT: gemini
          OWNER: ${{ needs.route.outputs.owner }}
          ISSUE: ${{ needs.route.outputs.issue }}
          PR: ${{ needs.route.outputs.pr }}
          BRANCH: ${{ needs.route.outputs.branch }}
          TRIGGER: ${{ needs.route.outputs.trigger }}
        run: |
          {
            echo 'text<<PROMPT_EOF'
            echo "## This run"
            echo "- Agent: $AGENT (cloud helper)"
            echo "- Working for: $OWNER"
            echo "- Issue: #$ISSUE"
            echo "- Pull request: ${PR:-none yet}"
            echo "- Branch: ${BRANCH:-none yet}"
            echo "- Trigger: $TRIGGER"
            echo
            git show origin/main:.github/agents/helper.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/run-gemini-cli@v0
        env:
          # Headless CI: Gemini CLI refuses untrusted folders and exits before doing anything.
          # The checkout is our own repo, so trust it.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          # Each human pays for their own Gemini: pick the key of the Issue's owner.
          gemini_api_key: ${{ needs.route.outputs.owner == 'Cagan2112' && secrets.GEMINI_API_KEY_CAGAN || secrets.GEMINI_API_KEY_KOSMINT }}
          gemini_model: ${{ vars.HELPER_GEMINI_MODEL }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Report failure on the Issue
        if: failure()
        env:
          ISSUE: ${{ needs.route.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "Cloud Gemini helper run failed or ran out of time: $RUN_URL. The lead will look at it."
